document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];

      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

      <\u002Flabel>\n      <button type=\"submit\" style=\"margin-top: 6px; padding: 16px 0; font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 15.5px; color: #FFFFFF; background: #1A4FD0; border: none; border-radius: 3px; cursor: pointer; transition: transform .2s, background .2s;\" style-hover=\"transform: translateY(-2px); background: #2A62EA;\">{{ contactLabel }}<\u002Fbutton>\n      <div style=\"font-size: 12.5px; line-height: 1.5; color: rgba(244,247,251,.55);\">{{ contactNote }}<\u002Fdiv>\n    <\u002Fform>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ FOOTER ============ -->\n<footer style=\"background: #071426; color: rgba(244,247,251,.6);\">\n  <div style=\"max-width: 1280px; margin: 0 auto; padding: 60px 48px 44px;\">\n    <div style=\"display: grid; grid-template-columns: 1.4fr 1fr; gap: 64px; padding-bottom: 40px; border-bottom: 1px solid rgba(244,247,251,.1);\">\n      <div>\n        <div style=\"display: flex; align-items: center; gap: 12px; color: #F4F7FB;\">\n          <span style=\"display: grid; place-items: center; width: 32px; height: 32px; background: #1A4FD0; color: #FFFFFF; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 13px;\">CG<\u002Fspan>\n          <span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 16px;\">Compound Growth Studio<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin: 18px 0 0; max-width: 480px; font-size: 13.5px; line-height: 1.7;\">A boutique growth strategy and digital marketing studio for modern health clinics offering high-value GLP-1, peptide therapy, medical weight loss, hormone health, longevity, metabolic, functional health, and wellness programs.<\u002Fp>\n        <div style=\"margin-top: 26px; max-width: 480px;\">\n          <div style=\"font-size: 13px; font-weight: 600; color: rgba(244,247,251,.8);\">Free guide: Top 10 reasons your clinic's ads are struggling on Meta<\u002Fdiv>\n          <form sc-camel-on-s "display: grid; gap: 11px; align-content: start; font-size: 14px;\">\n          <div style=\"font-size: 11.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: rgba(244,247,251,.4);\">Get started<\u002Fdiv>\n          <a href=\"/pricing/\" style=\"color: rgba(244,247,251,.75);\" style-hover=\"color: #7FB0FF;\">Pricing &amp; Community<\u002Fa>\n          <a href=\"/pricing/\" style=\"color: rgba(244,247,251,.75);\" style-hover=\"color: #7FB0FF;\">Join the newsletter<\u002Fa>\n          <a href=\"/contact/\" style=\"color: rgba(244,247,251,.75);\" style-hover=\"color: #7FB0FF;\">Book a growth call<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin: 28px 0 0; max-width: 900px; font-size: 12px; line-height: 1.7; color: rgba(244,247,251,.42);\">Compound Growth Studio provides marketing strategy, content, and digital growth support. Medical claims, treatment details, pricing, eligibility, prescription information, and patient-facing clinical content should be reviewed and approved by the clinic's licensed medical professionals before publishing.<\u002Fp>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440},&quot;ctaLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Find the Gaps in Your Growth System&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Copy&quot;},&quot;navCtaLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Find Your Growth Gaps&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Copy&quot;}}\">\nclass Component extends DCLogic {\n  state = { route: 'home', subscribed: false, sent: false, lead: false };\n\n  routeFromHash() {\n    const ok = ['services', 'glp-1-peptide-marketing', 'system', 'pricing', 'leadership', 'faq', 'contact', 'ai-voice-agent'];\n    const h = (location.hash || '').replace(/^#\\/?/, '').split('?')[0];\n    if (ok.includes(h)) return h;\n    if (window.__CGS_ROUTE && ok.includes(window.__CGS_ROUTE)) return window.__CGS_ROUTE;\n    const p = (location.pathname || '').replace(/\\/+$/, '').split('/').pop();\n    if (ok.includes(p)) return p;\n    return 'home';\n  }\n\n  componentDidMount() {\n    this.setState({ route: this.routeFromHash() });\n    this._onHash = () => {\n      this.setState({ route: this.routeFromHash(), subscribed: false, sent: false, lead: false });\n      window.scrollTo(0, 0);\n    };\n    window.addEventListener('hashchange', this._onHash);\n  }\n\n  componentWillUnmount() { window.removeEventListener('hashchange', this._onHash); }\n\n  _counterRefs = {};\n  _counted = {};\n\n  counterRef(id, end) {\n    if (!this._counterRefs[id]) {\n      this._counterRefs[id] = (el) => {\n        if (!el) return;\n        if (this._counted[id]) { el.textContent = String(end); return; }\n        el.textContent = '0';\n        this.watchCounter(el, end, id);\n      };\n    }\n    return this._counterRefs[id];\n  }\n\n  watchCounter(el, end, id) {\n    const run = () => {\n      this._counted[id] = true;\n      const ease = t => 1 - Math.pow(1 - t, 3);\n      const t0 = performance.now(), dur = 1600;\n      const tick = (now) => {\n        const p = Math.min(1, (now - t0) / dur);\n        el.textContent = String(Math.round(ease(p) * end));\n        if (p < 1) requestAnimationFrame(tick);\n      };\n      requestAnimationFrame(tick);\n    };\n    if (typeof IntersectionObserver !== 'function') { run(); return; }\n    const obs = new IntersectionObserver((entries) => {\n      entries.forEach(e => {\n        if (!e.isIntersecting) return;\n        obs.disconnect();\n        run();\n      });\n    }, { threshold: 0.35 });\n    obs.observe(el);\n  }\n\n  renderVals() {\n    const r = this.state.route;\n    const icon = (d) => React.createElement('svg', { width: 22, height: 22, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.8, strokeLinecap: 'round', strokeLinejoin: 'round' }, React.createElement('path', { d }));\n    return {\n      cta: this.props.ctaLabel ?? 'Find the Gaps in Your Growth System',\n      navCta: this.props.navCtaLabel ?? 'Find Your Growth Gaps',\n      isHome: r === 'home', isServices: r === 'services', isSystem: r === 'system',\n      isGlp1: r === 'glp-1-peptide-marketing',\n      isPricing: r === 'pricing', isLeadership: r === 'leadership', isFaq: r === 'faq', isContact: r === 'contact', isVoice: r === 'ai-voice-agent',\n      subscribeLabel: this.state.subscribed ? \"You're in — check your inbox\" : 'Send Me the Newsletter',\n      subscribeNote: this.state.subscribed ? 'Thanks. First issue lands within two weeks.' : 'Twice a month. Unsubscribe anytime.',\n      contactLabel: this.state.sent ? 'Request received — we\\u2019ll reply within one business day' : 'Request My Growth Gap Review',\n      contactNote: this.state.sent ? 'We\\u2019ll email you two or three times to find a slot that works.' : 'No obligation. We\\u2019ll never share your clinic details.',\n      onSubscribe: (e) => { e.preventDefault(); this.setState({ subscribed: true }); },\n      onContact: (e) => { e.preventDefault(); this.setState({ sent: true }); },\n      onLead: (e) => { e.preventDefault(); this.setState({ lead: true }); },\n      leadLabel: this.state.lead ? 'Sent \\u2014 check your inbox' : 'Send Me the Free Guide',\n      leadFootLabel: this.state.lead ? 'Sent \\u2713' : 'Get the Guide',\n      leadNote: this.state.lead ? 'On its way. You\\u2019re also on the newsletter \\u2014 unsubscribe anytime.' : 'Free guide + the twice-monthly newsletter. Unsubscribe anytime.',\n      pillars: [\n        { icon: icon('M12 21c-4-3.5-8-6.5-8-11a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 4.5-4 7.5-8 11z'), title: 'We understand the patient journey', body: 'Patients need education, reassurance, and trust before they ever request a consultation.' },\n        { icon: icon('M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7l8-4z'), title: 'We avoid hype-driven marketing', body: 'Responsible messaging, provider credibility, and claims clinics can review before publishing.' },\n        { icon: icon('M4 12h5m6 0h5M12 4v5m0 6v5M8 8l8 8m0-8l-8 8'), title: 'We build connected systems', body: 'Content, visibility, landing pages, follow-up, and reporting work together — not in silos.' },\n        { icon: icon('M3 17l6-6 4 4 8-8m0 0h-5m5 0v5'), title: 'We focus on consult-ready demand', body: 'Not just impressions — clearer education, stronger trust, and more qualified consultations.' },\n      ],\n      serviceGroups: [\n        { num: 'Stage 1', stage: 'Visibility', items: [\n          { title: 'Local SEO + Service Pages', body: 'Service pages, location pages, blog content, and copy that helps local patients understand and act.' },\n          { title: 'Paid Acquisition + Landing Pages', body: 'Campaign creative, landing page copy, lead forms, and consult flows designed around qualified interest.' },\n        ]},\n        { num: 'Stage 2', stage: 'Education', items: [\n          { title: 'Treatment Education + Messaging', body: 'Credible content for GLP-1, peptide therapy, weight loss, hormone health, and longevity — eligibility, expectations, and provider oversight.' },\n          { title: 'Social Media Management', body: 'Educational content for Instagram, Facebook, TikTok, LinkedIn, YouTube Shorts, and Google Business Profile.' },\n        ]},\n        { num: 'Stage 3', stage: 'Trust', items: [\n          { title: 'Provider Authority', body: 'Content that helps clinic owners and providers become trusted local voices.' },\n          { title: 'Trust + Reputation Systems', body: 'Review workflows, responsible trust signals, provider credibility, and patient-story structure for clinic approval.' },\n        ]},\n        { num: 'Stage 4', stage: 'Conversion', items: [\n          { title: 'Website + Conversion Copy', body: 'Homepage, service page, landing page, and consult-flow copy that makes complex programs easier to understand.' },\n          { title: 'Program Launch Campaigns', body: 'Campaigns for new medically guided programs, new locations, seasonal education, and service rollouts.' },\n        ]},\n        { num: 'Stage 5', stage: 'Follow-Up', items: [\n          { title: 'Email + SMS Follow-Up', body: 'Lead education, consult reminders, reactivation, retention, and patient follow-up sequences.' },\n        ]},\n        { num: 'Stage 6', stage: 'Optimization', items: [\n          { title: 'Reporting + Optimization', body: 'Dashboards, call tracking, attribution, and conversion testing that show which campaigns produce consultations.' },\n        ]},\n      ],\n      glpChallenges: [\n        { title: 'Platform policy blocks the obvious ads', body: 'Prescription-medication language, before-and-after imagery, and outcome claims get rejected. Clinics either water everything down or keep resubmitting the same campaign.' },\n        { title: 'Patients arrive skeptical', body: 'They have read conflicting things about compounded versus brand, side effects, and cost. Without education, interest never becomes a consultation request.' },\n        { title: 'Every competitor looks identical', body: 'Same offer, same stock photo, same price anchor. Without provider credibility and a real point of view, the decision defaults to whoever is cheapest.' },\n      ],\n      glpBuilds: [\n        { num: '01', title: 'Program positioning', body: 'What your program includes, who it is for, and why it is worth more than the cheapest option in town — stated plainly.' },\n        { num: '02', title: 'Compliant ad creative', body: 'Meta and Google campaigns structured around policy from the first draft, with creative that gets attention without triggering review.' },\n        { num: '03', title: 'Eligibility-first landing pages', body: 'Pages that qualify patients as they read — eligibility, expectations, provider oversight, cost transparency — then route them into intake.' },\n        { num: '04', title: 'Patient education library', body: 'Treatment explainers, FAQs, and comparison content that answers the real questions before someone books.' },\n        { num: '05', title: 'Provider-led authority content', body: 'Your clinicians on camera and in writing, so the trust signal comes from a person rather than a brand.' },\n        { num: '06', title: 'Nurture for the undecided', body: 'Email and SMS sequences for the majority who are interested but not ready — the largest missed opportunity in these programs.' },\n      ],\n      glpCompliance: [\n        { title: 'Your providers approve clinical content', body: 'Treatment details, eligibility, and any medical claim go through your licensed reviewers before publishing.' },\n        { title: 'No outcome promises or before-and-afters', body: 'We build credibility through process, oversight, and education instead of results imagery that platforms reject.' },\n        { title: 'Structured for prescription-ad review', body: 'Landing pages and creative follow platform requirements for regulated health categories from the start.' },\n        { title: 'Documented and auditable', body: 'Every claim traces back to an approved source, so a review request never becomes a scramble.' },\n      ],\n      stages: [\n        { num: '1', title: 'Visibility', tag: 'Get found by patients who can actually pay.', desc: 'Cash-pay GLP-1 and peptide patients are searching right now. We make sure your clinic shows up — through ads that clear Meta’s health-category review instead of getting rejected.', builds: ['Compliant paid acquisition', 'Local SEO', 'Google Business Profile'], handoffLabel: 'Passes on', handoff: 'A visitor who found you but isn\\u2019t ready to book.' },\n        { num: '2', title: 'Education', tag: 'Answer the questions that stall a $600/mo decision.', desc: 'Peptide and hormone patients don\\u2019t convert on impulse. We build the content that resolves their doubts — dosing, safety, “is this legit” — before they ever fill out a form.', builds: ['Treatment explainers', 'Provider-led content', 'FAQ resources'], handoffLabel: 'Passes on', handoff: 'A patient who understands the treatment but not yet you.' },\n        { num: '3', title: 'Trust', tag: 'Make your clinic the safe choice in a skeptical category.', desc: 'Weight-loss and TRT buyers have been burned by shady telehealth. We establish the provider authority and proof that separates you from the compounding-pharmacy noise.', builds: ['Provider authority', 'Reviews', 'Responsible, compliant messaging'], handoffLabel: 'Passes on', handoff: 'A patient who trusts you and is ready to act.' },\n        { num: '4', title: 'Conversion', tag: 'Turn interest into booked consultations.', desc: 'A ready patient still leaves if the path is clunky. We build the landing pages, intake, and CTAs that move them from “interested” to on your calendar — with conversion tracking that survives Meta’s data restrictions.', builds: ['Landing pages', 'Intake forms', 'Conversion tracking (CAPI)'], handoffLabel: 'Passes on', handoff: 'A booked lead worth keeping warm.' },\n        { num: '5', title: 'Follow-Up', tag: 'Stop losing patients between click and consult.', desc: 'No-shows and cold leads quietly bleed revenue. We keep qualified prospects engaged with automated nurture so the consultation actually happens.', builds: ['Email nurture', 'SMS reminders', 'Lead routing'], handoffLabel: 'Passes on', handoff: 'The data on who booked and who didn\\u2019t.' },\n        { num: '6', title: 'Optimization', tag: 'Double down on what produces qualified consults.', desc: 'Most clinics can\\u2019t tell which ad produced which patient. We track it end to end, then reinvest in what works — so the whole system compounds instead of plateaus.', builds: ['Attribution', 'Campaign reporting', 'Conversion testing'], handoffLabel: 'Loops back', handoff: 'Sharper targeting to Visibility — and the loop tightens.' },\n      ],\n      stats: [\n        { id: 'cnt1', ref: this.counterRef('cnt1', 150), prefix: '$', end: 150, suffix: 'M', title: 'B2B Brand & Revenue Growth', body: 'Conor supported revenue growth from $20M to $150M through integrated strategy and demand generation.' },\n        { id: 'cnt2', ref: this.counterRef('cnt2', 4), prefix: '', end: 4, suffix: 'B+', title: 'Audience & Media Growth', body: 'A global media brand built to 300,000+ followers and over 4 billion impressions across platforms.' },\n        { id: 'cnt3', ref: this.counterRef('cnt3', 25), prefix: '$', end: 25, suffix: 'M ARR', title: 'Scaled From the Ground Up', body: \"Nick helped scale Bitwage's U.S. ARR from essentially zero to ~$25M as VP of Growth.\" },\n        { id: 'cnt4', ref: this.counterRef('cnt4', 100), prefix: '', end: 100, suffix: '+', title: 'Healthcare Growth Infrastructure', body: 'Marketing direction for a PE-backed healthcare organization with 100+ locations in multiple states.' },\n      ],\n      partners: [\n        { name: 'Tony Pardilla', role: 'Creative Partner, Design & Web', bio: 'Tony supports creative and web execution behind the studio\\u2019s clinic growth work \\u2014 turning strategy into polished landing pages, campaign creative, visual systems, and conversion-focused digital experiences.', helps: ['Website design direction', 'Landing pages', 'Brand identity support', 'Campaign creative', 'Social templates', 'Conversion-focused design'] },\n        { name: 'Chris Cyril', role: 'Systems & Technology Partner', bio: 'Chris supports the systems and technology layer behind the growth engine \\u2014 connecting forms, tracking, CRM workflows, automation, integrations, analytics, and reporting.', helps: ['Lead form setup', 'CRM workflow support', 'Tracking', 'Automation systems', 'Funnel infrastructure', 'Reporting systems'] },\n        { name: 'Jessica Rodrigues', role: 'Client Experience Coordinator', bio: 'Jessica supports onboarding, communication, scheduling, follow-ups, asset collection, and project coordination \\u2014 so clinic teams always know what is happening and what comes next.', helps: ['Onboarding', 'Scheduling', 'Client communication', 'Follow-ups', 'Asset collection', 'Project coordination'] },\n      ],\n      track: [\n        'Led growth at Capital One Shopping, increasing the user base by more than 600% in six months.',\n        'Founded a digital marketing agency that was successfully acquired.',\n        'Led a 25+ person global demand generation organization.',\n        'Managed growth across more than a dozen SaaS products simultaneously.',\n        'Generated 500 qualified leads nationally for a new service vertical.',\n        'Created $1M in new recurring revenue through subscription-based programs.',\n      ],\n      faqs: [\n        { q: 'Do you only work with GLP-1 and weight loss clinics?', a: 'Those are the most common, but the system applies to any medically guided program with a high-value consultation: peptide therapy, hormone health, longevity, metabolic and functional health, and wellness programs.' },\n        { q: 'Can you keep our ads from getting rejected?', a: 'We structure pages, creative, and copy around prescription-advertising policy from the start — that is the single biggest reason clinic campaigns stall. We cannot guarantee a platform decision, but compliance is designed in rather than patched later.' },\n        { q: 'Who approves medical claims?', a: 'You do. Every treatment detail, eligibility statement, and patient-facing clinical claim goes to your licensed providers for review before it publishes. We write for review, not around it.' },\n        { q: 'How long until we see results?', a: 'Conversion work (landing pages, intake flows, follow-up) tends to show movement in the first 30–60 days. Visibility and education compound over 3–6 months. We report on both timelines so you can tell which is which.' },\n        { q: 'Do we have to buy the whole system?', a: 'No. Most clinics start with one stage — usually Conversion — and add Visibility, Follow-Up, or Optimization as capacity and demand grow. The stages are built to connect later.' },\n        { q: 'Will you work with our existing website or agency?', a: 'Yes. We often build alongside an existing site and hand off documentation. If you already have an agency running paid media, we can own conversion and follow-up and feed them better inputs.' },\n        { q: 'What do you need from us to start?', a: 'Access to your site, ad accounts, and analytics; one clinical reviewer for content approval; and roughly an hour a month from someone who can answer program questions. We handle the rest.' },\n        { q: 'What happens on the growth gap call?', a: 'Thirty minutes. We look at your visibility, your consult path, and your follow-up, then send a written summary of the gaps we found and what we would fix first — whether or not you hire us.' },\n      ],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
